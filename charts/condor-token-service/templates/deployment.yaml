apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "condor-token-service.fullname" . }}
  labels:
    {{- include "condor-token-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "condor-token-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "condor-token-service.selectorLabels" . | nindent 8 }}
    spec:
      # This pod never talks to the Kubernetes API; withholding the
      # ServiceAccount token removes an entire credential class from a pod
      # that already holds the pool password mount.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # See values.yaml: the pool password comes from a Secret volume
      # (kubelet-owned, not a node's filesystem), so the pod runs as a fixed
      # non-root uid/gid; everything else stays locked down (read-only
      # rootfs, drop ALL, no privilege escalation, RuntimeDefault seccomp).
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # HTCondor's SEC_TOKEN_POOL_SIGNING_KEY_FILE read refuses any file
        # that isn't tightly permissioned (root-owned hostPath mounts satisfy
        # this for free; a Secret volume mounts world-readable at 0644 owned
        # by root, which condor_token_create rejects outright: "Failed to
        # read file ... securely"). This container -- the only one in the
        # pod that runs as root -- copies the key out of the Secret mount
        # into the pool-password emptyDir with the strict ownership/mode
        # condor_token_create requires, before the main (non-root) container
        # ever starts.
        - name: fix-pool-password-perms
          image: {{ include "condor-token-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /pool-password-secret/POOL /pool-password/POOL
              chown {{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.runAsGroup }} /pool-password/POOL
              chmod 0600 /pool-password/POOL
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # CHOWN: hand the copied file to the main container's non-root
              # uid/gid. FOWNER: chmod it afterward (the copy is root-owned
              # at that point, not yet the target uid).
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: pool-password-secret
              mountPath: /pool-password-secret
              readOnly: true
            - name: pool-password
              mountPath: /pool-password
      containers:
        - name: condor-token-service
          image: {{ include "condor-token-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Names must match Settings fields (config.py).
            - name: BROKER_JWKS_URL
              value: {{ .Values.config.brokerJwksUrl | quote }}
            - name: BROKER_ISSUER
              value: {{ .Values.config.brokerIssuer | quote }}
            - name: EXPECTED_AUDIENCE
              value: {{ .Values.config.expectedAudience | quote }}
            - name: CONDOR_IDENTITY_DOMAIN
              value: {{ .Values.config.condorIdentityDomain | quote }}
            - name: CONDOR_TRUST_DOMAIN
              value: {{ .Values.config.condorTrustDomain | quote }}
            - name: TOKEN_LIFETIME_SECONDS
              value: {{ .Values.config.tokenLifetimeSeconds | quote }}
            - name: RATE_LIMIT_MAX_MINTS
              value: {{ .Values.config.rateLimitMaxMints | quote }}
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: {{ .Values.config.rateLimitWindowSeconds | quote }}
            - name: CONDOR_TOKEN_CREATE_BIN
              value: {{ .Values.config.condorTokenCreateBin | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # Extra env vars from values (name: value pairs)
            {{- range $key, $val := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            # The pool password, already copied + re-permissioned by the
            # fix-pool-password-perms init container above. Read-only here:
            # this container never needs to write it.
            - name: pool-password
              mountPath: {{ .Values.poolPassword.mountPath }}
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            # readyz verifies condor_token_create is executable and the
            # broker JWKS is fetchable.
            httpGet:
              path: /readyz
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: pool-password-secret
          secret:
            secretName: {{ .Values.poolPassword.secretName }}
            items:
              - key: {{ .Values.poolPassword.secretKey }}
                path: POOL
        - name: pool-password
          emptyDir: {}
