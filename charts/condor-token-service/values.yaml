# Default values for condor-token-service.
#
# This service exists because HTCondor IDTOKENS are signed with the pool
# password — a SYMMETRIC key that must never leave Condor infrastructure.
# The key is Secret-mounted (poolPassword below) rather than read from a
# node's filesystem, and this pod exposes exactly one minting endpoint to
# the af-mcp-broker.

# Two replicas across the login nodes give the mint path HA. The in-memory
# per-subject rate limit is per-replica, so the effective limit is
# rateLimitMax × replicaCount — acceptable for a cache-fronted mint path.
replicaCount: 2

image:
  registry: ghcr.io
  repository: maniaclab/condor-token-service
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Pull secret(s) for the registry above (ghcr packages default to private),
# e.g. [{name: ghcr-pull-secret}] with the SealedSecret deployed alongside.
imagePullSecrets: []

# Historically REQUIRED: this constrained the pod to the condor-enabled
# login nodes (login01–04 ONLY) whose filesystems held the pool password via
# hostPath. Now that the key comes from the htcondor-pool-password Secret
# (poolPassword below), that specific justification no longer applies —
# nothing about a Secret mount requires a particular node. Left unset here
# pending a deliberate decision on relaxing it; the pool spike's node
# inventory (docs/pool-spike.md) still applies if you don't. If you do keep
# a constraint, the pool spike found NO usable shared label on those four
# nodes (login04 alone has `login: "true"`; login05 has `partition: login`
# but is NOT condor-enabled — a trap), so either use `affinity` below with
# an explicit hostname list, or (cleaner) apply a purposeful label to the
# four nodes and select it:
#   nodeSelector:
#     af.uchicago.edu/condor-client: "true"
nodeSelector: {}

# If you keep the historical node constraint (see nodeSelector's comment
# above) and have no shared label: nodeAffinity with an explicit hostname
# list, e.g.
#   affinity:
#     nodeAffinity:
#       requiredDuringSchedulingIgnoredDuringExecution:
#         nodeSelectorTerms:
#           - matchExpressions:
#               - key: kubernetes.io/hostname
#                 operator: In
#                 values:
#                   - login01.af.uchicago.edu
#                   - login02.af.uchicago.edu
#                   - login03.af.uchicago.edu
#                   - login04.af.uchicago.edu
affinity: {}

# The AF login nodes carry the taint `dedicated=ssh:NoSchedule`; the pod
# must tolerate it to schedule there:
#   tolerations:
#     - key: "dedicated"
#       operator: "Equal"
#       value: "ssh"
#       effect: "NoSchedule"
tolerations: []

# Environment for the service (see src/condor_token_service/config.py for
# the full documentation of each setting).
config:
  # Where the broker publishes the JWKS for its AF Broker Identity Token
  # signing keys (maniaclab/af-mcp-platform#162). Must agree with the
  # networkPolicy.jwks egress rule below: the default fetches IN-CLUSTER,
  # matching the default egress selectors (the public
  # https://mcp.af.uchicago.edu URL is blocked by that policy — using it
  # requires replacing networkPolicy.jwks with an ipBlock rule for the
  # ingress). This is a fetch location only; iss validation is
  # brokerIssuer below.
  brokerJwksUrl: "http://af-mcp-platform-broker.mcp.svc.cluster.local:8080/.well-known/jwks.json"
  # Required `iss` claim on inbound identity tokens.
  brokerIssuer: "https://mcp.af.uchicago.edu"
  # Required `aud` claim — this service's identity in the protocol.
  expectedAudience: "condor-token-service"
  # IDTOKENs are minted for `{unixname}@{condorIdentityDomain}`. This is
  # the pool's USER/UID domain (condor_config_val UID_DOMAIN), NOT its
  # TRUST_DOMAIN — the spike showed the schedd rejects identities minted
  # under the trust domain (docs/pool-spike.md).
  condorIdentityDomain: "af.uchicago.edu"
  # The pool's TRUST_DOMAIN (condor_config_val TRUST_DOMAIN), exported to
  # condor_token_create as _CONDOR_TRUST_DOMAIN and landing in the minted
  # token's `iss`. REQUIRED in this chart's containerized setting: the image
  # carries no HTCondor config, so an unset trust domain makes
  # condor_token_create fall back to the pod hostname -- minting
  # `iss=<pod name>` tokens the schedd rejects.
  condorTrustDomain: "head01.af.uchicago.edu"
  # Passed to `condor_token_create -lifetime` (seconds).
  tokenLifetimeSeconds: 3600
  # Per-subject sliding-window rate limit.
  rateLimitMaxMints: 30
  rateLimitWindowSeconds: 300
  # Path to (or PATH-resolved name of) the condor_token_create binary in the
  # container image.
  condorTokenCreateBin: "condor_token_create"
  logLevel: "INFO"

# Extra environment variables (name: value) appended verbatim.
env: {}

poolPassword:
  # HTCondor pool signing key (POOL), sourced from a Secret so the key
  # material lives only in-cluster and never touches a node's filesystem.
  # Mirrors how the AF htcondor namespace's execute/submit pods consume the
  # same Secret (af/htcondor/execute/deployment-*.yaml, af/htcondor/submit).
  #
  # NOT mounted directly into the app container: a Secret volume mounts
  # world-readable (0644, root-owned), which condor_token_create's own
  # secure-file check rejects. The deployment's fix-pool-password-perms init
  # container copies it into an emptyDir with the ownership/mode
  # condor_token_create requires -- see templates/deployment.yaml.
  secretName: htcondor-pool-password
  secretKey: htcondor-pool-password
  # condor_token_create's default SEC_PASSWORD_DIRECTORY expects a file
  # literally named POOL in this directory.
  mountPath: /etc/condor/passwords.d

# Pod-level security context. A Secret-mounted file is owned by the kubelet,
# not a node's filesystem, so — unlike the old hostPath mount — nothing here
# requires root: the pod runs as a fixed non-root uid/gid, the root
# filesystem is read-only, all capabilities are dropped, privilege
# escalation is disabled, seccomp is RuntimeDefault, and no ServiceAccount
# token is mounted.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

service:
  # ClusterIP only — the sole intended client is the in-cluster broker.
  port: 8080

networkPolicy:
  enabled: true
  # Ingress: ONLY the broker may reach the minting endpoint. Defaults match
  # the production af-mcp-platform deployment as verified by the pool spike:
  # namespace `mcp`, broker pods labeled name=af-mcp-platform +
  # component=broker.
  broker:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mcp
    podSelector:
      matchLabels:
        app.kubernetes.io/name: af-mcp-platform
        app.kubernetes.io/component: broker
  # Egress: besides DNS, ONLY the origin serving config.brokerJwksUrl.
  # Defaults assume the JWKS is served by the same in-cluster broker pods;
  # if the JWKS is only reachable via an external ingress, replace the
  # selectors with an ipBlock-based rule for that origin.
  jwks:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mcp
    podSelector:
      matchLabels:
        app.kubernetes.io/name: af-mcp-platform
        app.kubernetes.io/component: broker
    port: 8080

# e.g. {limits: {memory: 256Mi}, requests: {cpu: 50m, memory: 128Mi}}
resources: {}

nameOverride: ""
fullnameOverride: ""
